<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">토스증권 Open API와 PenguinNotch 주식 표시 흐름</title>
  <desc id="desc">WTS에서 발급한 Client ID와 Client secret을 macOS 키체인에 저장하고, OAuth 인증 후 가격, 실시간 체결, 봉 데이터를 받아 노치에 표시한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6c8194"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="25" fill="#f3f8ff"/>
  <text x="38" y="52" fill="#163858" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="27" font-weight="700">토스증권 Open API → PenguinNotch</text>
  <text x="38" y="80" fill="#536f85" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="15">주식 위젯의 데이터 흐름 · 거래 주문 기능은 사용하지 않습니다</text>

  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <rect x="36" y="127" width="245" height="212" rx="19" fill="#fff" stroke="#cbdff3" stroke-width="2"/>
    <circle cx="69" cy="160" r="17" fill="#3182f6"/>
    <text x="69" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="52" y="205" fill="#173756" font-size="20" font-weight="700">WTS에서 API 키 발급</text>
    <text x="52" y="239" fill="#506b81" font-size="15">Client ID · Client secret</text>
    <text x="52" y="271" fill="#506b81" font-size="15">허용 IP에 현재 Mac의</text>
    <text x="52" y="294" fill="#506b81" font-size="15">공인 IP 등록</text>

    <rect x="335" y="127" width="245" height="212" rx="19" fill="#fff" stroke="#cbdff3" stroke-width="2"/>
    <circle cx="368" cy="160" r="17" fill="#3182f6"/>
    <text x="368" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="351" y="205" fill="#173756" font-size="20" font-weight="700">macOS 키체인</text>
    <text x="351" y="239" fill="#506b81" font-size="15">앱 설정에서 키 저장</text>
    <text x="351" y="271" fill="#506b81" font-size="15">비밀값은 설정 파일에</text>
    <text x="351" y="294" fill="#506b81" font-size="15">기록하지 않음</text>

    <rect x="634" y="127" width="245" height="212" rx="19" fill="#fff" stroke="#a7cbfa" stroke-width="2"/>
    <circle cx="667" cy="160" r="17" fill="#3182f6"/>
    <text x="667" y="166" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
    <text x="650" y="205" fill="#173756" font-size="20" font-weight="700">시세 API 요청</text>
    <text x="650" y="239" fill="#506b81" font-size="15">OAuth 토큰 발급</text>
    <text x="650" y="270" fill="#506b81" font-size="15">가격 · 실시간 체결</text>
    <text x="650" y="294" fill="#506b81" font-size="15">1분봉 · 일봉 조회</text>

    <rect x="933" y="127" width="230" height="212" rx="19" fill="#101419"/>
    <circle cx="966" cy="160" r="17" fill="#69d8ad"/>
    <text x="966" y="166" text-anchor="middle" fill="#102e25" font-size="16" font-weight="700">4</text>
    <text x="949" y="205" fill="#fff" font-size="20" font-weight="700">PenguinNotch</text>
    <text x="949" y="239" fill="#d8e8ef" font-size="15">종목별 현재가 표시</text>
    <text x="949" y="270" fill="#d8e8ef" font-size="15">호버 시 차트 표시</text>
    <text x="949" y="294" fill="#d8e8ef" font-size="15">10분봉은 앱에서 집계</text>
  </g>
  <g fill="none" stroke="#6c8194" stroke-width="3" marker-end="url(#arrow)">
    <path d="M289 232h35"/>
    <path d="M588 232h35"/>
    <path d="M887 232h35"/>
  </g>
  <text x="37" y="384" fill="#5a7185" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="14">설명용 그림 · 토스증권의 공식 이미지가 아닙니다</text>
</svg>
