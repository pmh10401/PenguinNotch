<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">PenguinNotch overview</title>
  <desc id="desc">Illustration of a top-edge notch with AI usage, system meters, and stock quotes. Values are examples.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#e7f5ff"/>
      <stop offset="1" stop-color="#eafaf4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#123b55" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="1000" height="440" rx="28" fill="url(#background)"/>
  <circle cx="95" cy="90" r="100" fill="#79c7ff" opacity=".15"/>
  <circle cx="916" cy="380" r="158" fill="#73dbb3" opacity=".15"/>
  <text x="50" y="68" fill="#17374b" font-family="Arial, sans-serif" font-size="26" font-weight="700">PenguinNotch</text>
  <text x="50" y="96" fill="#527082" font-family="Arial, sans-serif" font-size="15">AI usage · System status · Stock quotes</text>

  <g filter="url(#shadow)">
    <rect x="141" y="143" width="718" height="180" rx="34" fill="#101419"/>
    <path d="M350 143h300v14a25 25 0 0 1-25 25H375a25 25 0 0 1-25-25z" fill="#020405"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <circle cx="218" cy="226" r="30" fill="none" stroke="#303b45" stroke-width="8"/>
    <path d="M218 196a30 30 0 1 1-27 43" fill="none" stroke="#ff6a43" stroke-width="8" stroke-linecap="round"/>
    <text x="260" y="218" font-size="17" font-weight="700">AI usage</text>
    <text x="260" y="249" font-size="28">73%</text>

    <path d="M410 183v100" stroke="#34434b"/>
    <circle cx="463" cy="222" r="26" fill="none" stroke="#303b45" stroke-width="7"/>
    <path d="M463 196a26 26 0 0 1 25 32" fill="none" stroke="#50d8a1" stroke-width="7" stroke-linecap="round"/>
    <text x="505" y="218" font-size="17" font-weight="700">CPU</text>
    <text x="505" y="249" font-size="28">28%</text>

    <path d="M616 183v100" stroke="#34434b"/>
    <path d="M676 221h55l11-16 17 33 12-17h18" fill="none" stroke="#7fb8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="668" y="272" font-size="17" font-weight="700">STOCKS</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#527082">
    <text x="151" y="371">Hover for details</text>
    <text x="732" y="371">Illustration · sample values</text>
  </g>
</svg>
