name: Windows

# The port under windows/ is Rust, and CI and Package only ever run Xcode, so a
# Windows change could merge on a green check that never compiled it. Its own
# file, so those two stay about the Mac app.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    if: github.repository == 'pmh10401/PenguinNotch'
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      # First, and quick: cargo never reads the pages, so a syntax error in
      # their script stays green through the build and ships as an empty
      # window. Node is already on the runner.
      - name: Check the UI pages parse
        run: node scripts/check-ui-scripts.mjs

      - name: Test light surface theme
        run: node --test test-light-surface.cjs

      - name: Test Claude sign-in controls
        run: node scripts/test-claude-auth-ui.cjs

      - name: Test Korean card localization
        run: node --test scripts/test-ko-i18n.cjs

      - name: Test stock analysis and history
        run: node --test scripts/test-stocks.cjs

      - name: Test system widgets and disk volumes
        run: node scripts/test-widgets.cjs

      - name: Test usage display parity
        run: node --test scripts/test-usage-display.cjs

      # Render the actual pages on the Windows runner. IPC fixtures remain public
      # and offline; this covers Web UI behavior, not physical monitor hardware.
      - name: Test rendered settings and notch
        shell: pwsh
        run: |
          $qa = Join-Path $env:RUNNER_TEMP 'penguinnotch-browser-qa'
          npm install --prefix $qa --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $qa 'node_modules'
          node (Join-Path $env:NODE_PATH 'playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SETTINGS_EVIDENCE = Join-Path $env:RUNNER_TEMP 'penguinnotch-settings-evidence'
          node scripts/test-settings-browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-notch-scroll-browser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-updater-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-settings-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/penguinnotch-settings-evidence
          if-no-files-found: ignore

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri and the windows crate make a cold build several minutes long.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Test Codex headline selection
        run: node --test test-codex-headline.cjs

      # Reported rather than enforced: the crate already carries warnings, and
      # failing on them would hold every change hostage to that cleanup.
      - name: Clippy
        run: cargo clippy --all-targets --locked
