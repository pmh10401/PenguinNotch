name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: github.repository == 'pmh10401/PenguinNotch'
    name: Unit tests
    # macOS 26, because that is what the app targets. An older image ships an
    # Xcode that cannot read the project at all — `objectVersion 77` is a
    # format it does not know — long before it gets as far as the macOS 26
    # deployment target or the Liquid Glass APIs the settings panel uses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Printed rather than assumed: when this job fails on a runner image
      # change, the toolchain is the first thing worth seeing.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check local signing detection
        run: bash Scripts/test-signing.sh

      # Unsigned on purpose: no identity exists on a runner, and the tests
      # read fixtures rather than keychains — see `make test-ci`.
      - name: Run unit tests
        run: make test-ci

      # Preserve the rendered public-fixture attachments when a CI-only UI
      # assertion fails; a generic XCTAssertTrue log cannot diagnose OCR/layout.
      - name: Preserve failed native test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macOS-test-results-${{ github.sha }}
          path: ~/Library/Developer/Xcode/DerivedData/PenguinNotch-*/Logs/Test/*.xcresult
          if-no-files-found: warn

      - name: Verify SwiftPM resolution
        run: make verify-deps
